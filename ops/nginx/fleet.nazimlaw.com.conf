# fleet-cloud Nginx site template for fleet.nazimlaw.com (issue #3).
#
# Host convention: install into /etc/nginx/conf.d/fleet.nazimlaw.com.conf
# (the nazimlaw.com host keeps per-site files in conf.d), run `nginx -t`,
# then `systemctl reload nginx`. The origin certificate is the shared
# host certificate pair used by the other nazimlaw.com sites.
#
# Cloudflare terminates public TLS with Full (strict); this server block is
# the origin and listens on 443 with the host origin certificate.

# WebSocket upgrade handling for the Traccar web UI live positions stream.
# Variable name is prefixed to avoid collisions with other included sites.
map $http_upgrade $fleet_conn_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name fleet.nazimlaw.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name fleet.nazimlaw.com;

    ssl_certificate     /etc/nginx/ssl/nazimlaw.com-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/nazimlaw.com-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Traccar media uploads; keep small unless large uploads are required.
    client_max_body_size 25m;

    # Do not advertise the Traccar version or Nginx build.
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;

        # WebSocket support (Traccar live tracking).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fleet_conn_upgrade;

        # Forwarding headers so Traccar sees the real client and scheme.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # Long-lived WebSocket and report requests.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }
}
