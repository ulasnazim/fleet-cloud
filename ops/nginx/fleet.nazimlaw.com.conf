# fleet-cloud Nginx final TLS site for fleet.nazimlaw.com (issue #3).
#
# Host convention (verified on the authorized VPS):
#   * site files live in /etc/nginx/sites-available/ and are enabled with a
#     symlink in /etc/nginx/sites-enabled/;
#   * ACME HTTP-01 challenges are served from the shared /var/www/html webroot;
#   * TLS certificates are Let's Encrypt under
#     /etc/letsencrypt/live/<hostname>/{fullchain.pem,privkey.pem}, with the
#     host options include and dhparams.
#
# This file is installed only AFTER the certificate exists. The first
# deployment bootstraps a temporary HTTP-only site and obtains the certificate
# first — see docs/RUNBOOK.md §4.

# WebSocket upgrade handling for the Traccar web UI live positions stream.
# Variable name is prefixed to avoid collisions with other included sites.
map $http_upgrade $fleet_conn_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name fleet.nazimlaw.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fleet.nazimlaw.com;

    access_log /var/log/nginx/fleet.nazimlaw.com.access.log;
    error_log  /var/log/nginx/fleet.nazimlaw.com.error.log;

    ssl_certificate     /etc/letsencrypt/live/fleet.nazimlaw.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fleet.nazimlaw.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Traccar media uploads; keep small unless large uploads are required.
    client_max_body_size 25m;

    # Do not advertise the Traccar version or Nginx build.
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;

        # WebSocket support (Traccar live tracking).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fleet_conn_upgrade;

        # Forwarding headers so Traccar sees the real client and scheme.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # Long-lived WebSocket and report requests.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }
}
