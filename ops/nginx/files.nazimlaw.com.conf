# fleet-cloud-opencloud Nginx TLS site for files.nazimlaw.com (issue #7).
#
# Host convention (same as fleet.nazimlaw.com):
#   * site files live in /etc/nginx/sites-available/ and are enabled with a
#     symlink in /etc/nginx/sites-enabled/;
#   * ACME HTTP-01 challenges are served from the shared /var/www/html webroot;
#   * TLS certificates are Let's Encrypt under
#     /etc/letsencrypt/live/<hostname>/{fullchain.pem,privkey.pem}, with the
#     host options include and dhparams.
#
# This file is installed only AFTER the certificate exists. The first
# deployment bootstraps a temporary HTTP-only site and obtains the certificate
# first — see docs/RUNBOOK-opencloud.md §4.

# WebSocket/SSE upgrade handling for the OpenCloud web UI. The variable name
# is prefixed to avoid collisions with other included sites.
map $http_upgrade $opencloud_conn_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name files.nazimlaw.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name files.nazimlaw.com;

    access_log /var/log/nginx/files.nazimlaw.com.access.log;
    error_log  /var/log/nginx/files.nazimlaw.com.error.log;

    ssl_certificate     /etc/letsencrypt/live/files.nazimlaw.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.nazimlaw.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Do not advertise the Nginx build.
    server_tokens off;

    # OpenCloud uploads files through Tus; without a large body limit uploads
    # over the default 1 MB fail. Raise for large media if needed.
    client_max_body_size 10g;

    # Essential for Server-Sent Events (file/folder updates): no buffering.
    proxy_buffering off;
    proxy_request_buffering off;

    # Long-lived sync/upload connections.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    keepalive_requests 100000;
    keepalive_timeout 5m;
    proxy_next_upstream off;

    location / {
        proxy_pass http://127.0.0.1:9200;
        proxy_http_version 1.1;

        # SSE/WebSocket upgrade passthrough.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $opencloud_conn_upgrade;

        # Forwarding headers so OpenCloud sees the real client and scheme.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
